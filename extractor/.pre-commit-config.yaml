repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.25
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/allganize/ty-pre-commit
    rev: v0.0.79
    hooks:
      - id: ty-check
        args: [--project, extractor]
        exclude: '^extractor/plugin/'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: '\.(bin|bqrs|csv)$'
      - id: trailing-whitespace
        exclude: '\.(bin|bqrs|csv)$'

  - repo: local
    hooks:
      - id: check-versions
        name: versions and dbscheme match between extractor/ and qlpack/<version>/
        language: system
        entry: python3 extractor/manage.py check-versions
        pass_filenames: false
        always_run: true

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.18.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']
